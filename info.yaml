# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "GF180MCU integer-N PLL RFIC (2.4-2.5 GHz)"
  team: "A01"
  discord: "gregorydaley_87272_39557"
  description: "PLL building blocks in GF180MCU: LC-VCO (4.11-6.37 GHz), CML divide-by-2 quadrature divider, PFD and charge pump; 2.4-2.5 GHz ISM quadrature output with off-chip loop filter."
  lvs_config: "lvs/lvs_config.json"

# ======================================================
# Pad / pin list  (config B: 1/8 die, 16-pin total, 10 used, 6 spare)
# Order = CLOCKWISE from bottom-left in the upper-left quadrant. VDDA first so all
# seven analog pads sit on the analog rail; VDDD breaks the power ring so the digital
# pad lands on the digital rail. Ground is a single chip-wide common (no pin).
# RST_N and MON_OUT DROPPED 2026-08-20: DIV2_QUAD_v1 exposes no reset port (RST_N had
# nowhere to land) and no block exposes a monitor tap (MON_OUT could only be a divider
# phase at ~2.5 GHz, far too fast for a monitor pad). Dropping them avoids reopening any
# signed-off block; well inside config B's 16.
# ISS added 2026-08-20: the LC-VCO tail node. It must stay a SEPARATE pad (not tied to GND)
# so the tail current stays controllable off-chip -- grounding it on-chip would change the
# operating point away from the characterized 4.13-6.35 GHz band (simulated with a 1 mA tail
# mirror driving ISS). Placed among the analog group so it lands on the analog rail.
# GROUND PADS REQUIRED (Bailey 2026-08-20): "multiple grounds require multiple pads; pair each
# power pin with a ground pin; the first quadrant pin is a fixed down-bonded quiet ground."
# VSSA (index 0 = the quiet quadrant ground) and VSSD added. Both tie to the shared GND ring /
# p-substrate (electrically one net without deep-nwell); the two pads separate bond-wire L.
# Source of truth: docs/pins.md (analog 8, digital 1, power 2, ground 2 = 13).
# ======================================================
pins:
  - name: VSSA
    io_type: ground
  - name: VDDA
    io_type: power
  - name: IBIAS
    io_type: analog
    secondary_esd: true
  - name: ISS
    io_type: analog
    secondary_esd: true
  - name: VTUNE
    io_type: analog
    secondary_esd: true
  - name: CP_OUT
    io_type: analog
    secondary_esd: true
  - name: I_P
    io_type: analog
    secondary_esd: true
  - name: I_N
    io_type: analog
    secondary_esd: true
  - name: Q_P
    io_type: analog
    secondary_esd: true
  - name: Q_N
    io_type: analog
    secondary_esd: true
  - name: VSSD
    io_type: ground
  - name: VDDD
    io_type: power
  - name: REF_IN
    io_type: input_cmos
